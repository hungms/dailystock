<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>港股每日紀錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="top">
    <div class="title">
      <h1>港股每日紀錄</h1>
      <span class="meta" id="updated">載入中…</span>
    </div>
    <div class="actions">
      <form id="form-jump" class="jump" autocomplete="off">
        <input id="jump" list="jump-list" placeholder="搜尋代號或名稱" enterkeyhint="go">
        <datalist id="jump-list"></datalist>
      </form>
      <button id="btn-add" class="primary">＋ 新增</button>
      <button id="btn-manage">管理／紀錄</button>
      <button id="btn-settings">設定</button>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main class="table-wrap" id="wrap">
    <table id="grid">
      <thead></thead>
      <tbody></tbody>
    </table>
  </main>

  <dialog id="dlg-chart" class="full">
    <div class="chart-head">
      <h2 id="chart-title"></h2>
      <div class="seg" id="chart-range">
        <button data-days="14" class="on">14日</button>
        <button data-days="30">30日</button>
        <button data-days="90">90日</button>
      </div>
      <button id="chart-close" class="close" aria-label="關閉">✕</button>
    </div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
  </dialog>

  <dialog id="dlg-manage" class="full">
    <div class="chart-head">
      <h2>管理股票</h2>
      <div class="seg" id="mg-tabs">
        <button data-tab="list" class="on">關注列表 <span id="mg-count"></span></button>
        <button data-tab="log">變動紀錄</button>
      </div>
      <button id="mg-close" class="close" aria-label="關閉">✕</button>
    </div>

    <section class="mg-panel" id="mg-panel-list">
      <form id="form-quickadd" class="quickadd" autocomplete="off">
        <input id="qa-input" placeholder="輸入代號加入，例如 700 或 1810 小米集團" enterkeyhint="done">
        <textarea id="qa-bulk" rows="5" hidden placeholder="每行或以逗號分隔多隻：&#10;700, 9988, 5&#10;1810 小米集團&#10;0388.HK 香港交易所"></textarea>
        <div class="qa-buttons">
          <button type="button" id="qa-toggle">批量</button>
          <button type="submit" class="primary" id="qa-ok">加入</button>
        </div>
      </form>
      <p class="small" id="qa-msg"></p>
      <div class="mg-toolbar">
        <input id="mg-filter" placeholder="篩選列表" autocomplete="off">
        <label class="check"><input type="checkbox" id="mg-all"> 全選</label>
        <button id="mg-remove-sel" class="danger" disabled>移除所選</button>
      </div>
      <div class="mg-list" id="mg-list"></div>
    </section>

    <section class="mg-panel" id="mg-panel-log" hidden>
      <div class="mg-toolbar">
        <div class="seg" id="log-filter">
          <button data-f="all" class="on">全部</button>
          <button data-f="add">新增</button>
          <button data-f="remove">移除</button>
        </div>
        <span class="small" id="log-summary"></span>
      </div>
      <div class="mg-list" id="log-list"></div>
    </section>
  </dialog>

  <div id="toast" class="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" hidden>復原</button>
  </div>

  <dialog id="dlg-settings">
    <form method="dialog" id="form-settings">
      <h3>設定</h3>
      <p class="small">新增／移除股票會直接修改 GitHub 儲存庫內的 <code>stocks.json</code>，需要一個 GitHub 存取權杖（Fine-grained token，只授權此儲存庫的 Contents 讀寫）。權杖只會儲存在此瀏覽器，不會上傳到儲存庫。</p>
      <label>儲存庫（擁有者/名稱）
        <input id="set-repo" placeholder="例如 yourname/dailystock" autocomplete="off" autocapitalize="off">
      </label>
      <label>分支
        <input id="set-branch" placeholder="main" autocomplete="off" autocapitalize="off">
      </label>
      <label>GitHub 權杖
        <input id="set-token" type="password" placeholder="github_pat_…" autocomplete="off">
      </label>
      <div class="dlg-actions">
        <button value="clear" formnovalidate>清除權杖</button>
        <button value="cancel" formnovalidate>取消</button>
        <button value="ok" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
