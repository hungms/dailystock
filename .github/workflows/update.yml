name: 更新股價並發佈

on:
  schedule:
    # 港股交易時段（HKT 09:15–16:15 = UTC 01:15–08:15），週一至週五每小時
    - cron: "15 1-8 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: 下載股價
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/fetch_prices.py

      - name: 準備網站檔案
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js stocks.json _site/
          cp data/prices.json data/names.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
